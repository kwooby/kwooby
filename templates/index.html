{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% bock content %}
    <h1>Login to View Kwooby</h1>

    <main>
        <form method="POST" action="/login">
    
            <label for="password">Password:</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Enter</button>
        </form>
    </main>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

{% endblock %}
