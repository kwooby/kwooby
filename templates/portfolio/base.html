<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | Kwooby</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/AD-monogram.png') }}">
</head>

<body>
<header>
    <nav>
        <ul class="nav-bar">

            <li>
                <a 
                    href ="{{ url_for('index') }}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Home
                </a>
            </li>

            <li>
                <a 
                    href="{{ url_for('about') }}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    About
                </a>
            </li>

            <li class="dropdown">

                <a 
                    href="{{ url_for('dashboard') }}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Mile Tracker
                </a>
                
                <ul class="dropdown-menu">

                    <li class="dropdown-item">
                        <a 
                            href="{{ url_for('dashboard') }}"
                        >
                            Dashboard
                        </a>
                    </li>

                    <li class="dropdown-item">
                        <a 
                            href="{{ url_for('runs_history') }}"
                        >
                            History
                        </a>
                    </li>

                    <li class="dropdown-item">
                        <a 
                            href="{{ url_for('settings') }}"
                        >
                            Settings
                        </a>
                    </li>

                    <li class="dropdown-item">
                        <a 
                            href="{{  url_for('logout') }}"
                        >
                            Logout
                        </a>
                    </li>

                </ul>
            </li>

            <li>
                <a 
                    href="https://integration-hub-frontend-vsds.onrender.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Integration Hub
                </a>
            </li>
            
        </ul>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>Alex C Davis | Kwooby</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
